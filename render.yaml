services:
  - type: web
    name: worker-timer-monitor
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SCREENSHOT_MIN_SECONDS
        value: 120
      - key: SCREENSHOT_MAX_SECONDS
        value: 300
    disk:
      name: worker-timer-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
