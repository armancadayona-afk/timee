name: Build Android APKs
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apks.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [admin, worker1, worker2, worker3]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        env:
          SERVER_BASE_URL: ${{ vars.SERVER_BASE_URL || 'https://worker-timer-monitor-yqg3.onrender.com' }}
        run: |
          gradle "assemble${{ matrix.flavor }}Debug" -PserverBaseUrl="$SERVER_BASE_URL"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitty-${{ matrix.flavor }}-debug-apk
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error
