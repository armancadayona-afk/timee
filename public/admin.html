<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work Timer Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .wrap { width: min(1200px, 100%); margin: 0 auto; padding: 24px 18px 44px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { padding: 20px; }
    video { width: 100%; background: #02050a; border-radius: 12px; aspect-ratio: 4/3; }
    .timer { font-size: 38px; margin: 12px 0 2px; }
    .est-pay { font-size: 16px; font-weight: 700; color: #34D399; margin-bottom: 8px; }
    .history { white-space: pre-wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
    .tools { display: flex; gap: 12px; margin: 20px 0; }
    .controls-group { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    .controls-group .btn { flex: 1; min-width: 90px; }

    @keyframes pulse-red {
      0% { background-color: #EF4444; }
      50% { background-color: #B91C1C; }
      100% { background-color: #EF4444; }
    }

    .btn-record-active {
      animation: pulse-red 1.5s infinite;
      color: #FFFFFF !important;
      font-weight: bold;
    }

    /* Modal Overlay for Reset Confirmation */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-content {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      max-width: 420px;
      width: 90%;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Work Timer Admin</h1>
    <p class="muted">Worker camera control, screen sharing & recording panel.</p>
    <div class="tools">
      <button class="btn secondary" id="logout">Log Out</button>
    </div>
    <p id="message">Connecting…</p>
    <section id="workers" class="grid"></section>

    <!-- Tasks Management Section -->
    <section class="card" style="margin-top: 24px;">
      <h2>Tasks Management</h2>
      <p class="muted" style="margin-bottom: 16px;">Assign and review worker tasks in real-time.</p>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
        <!-- Assign Task Form -->
        <div style="background: var(--panel-2); padding: 16px; border-radius: 12px; border: 1px solid var(--line);">
          <h3>Assign New Task</h3>
          <form id="taskForm" onsubmit="event.preventDefault(); assignTask();">
            <label>Assign Task To:
              <select id="taskWorkerId" style="width: 100%; margin-top: 7px; padding: 10px; border-radius: 8px; background: #08111f; color: var(--text); border: 1px solid var(--line);">
                <option value="worker1">Worker 1</option>
                <option value="worker2">Worker 2</option>
                <option value="worker3">Worker 3</option>
              </select>
            </label>

            <label>Task Title:
              <input type="text" id="taskTitle" placeholder="e.g. Update listing photos" required>
            </label>

            <label>Task Description:
              <textarea id="taskDesc" rows="3" placeholder="Enter task instructions..." style="width: 100%; margin-top: 7px; padding: 10px; border-radius: 8px; background: #08111f; color: var(--text); border: 1px solid var(--line); font-family: inherit;"></textarea>
            </label>

            <div style="display: flex; gap: 10px;">
              <label style="flex: 1;">Due Date:
                <input type="date" id="taskDueDate">
              </label>
              <label style="flex: 1;">Due Time:
                <input type="time" id="taskDueTime">
              </label>
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 14px;">ASSIGN TASK</button>
          </form>
        </div>

        <!-- Task List -->
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3>Task List</h3>
            <select id="filterTaskWorker" onchange="loadTasks()" style="padding: 6px 10px; border-radius: 8px; background: #08111f; color: var(--text); border: 1px solid var(--line);">
              <option value="">All Workers</option>
              <option value="worker1">Worker 1</option>
              <option value="worker2">Worker 2</option>
              <option value="worker3">Worker 3</option>
            </select>
          </div>
          <div id="adminTaskList" style="display: grid; gap: 12px; max-height: 480px; overflow-y: auto;">
            <p class="muted">Loading tasks…</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Chat Section -->
    <section class="card" style="margin-top: 24px;">
      <h2>Private Chat</h2>
      <p class="muted" style="margin-bottom: 16px;">Direct private message threads with each worker.</p>

      <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px;">
        <label style="margin: 0;">Select Worker: </label>
        <select id="chatWorkerSelect" onchange="switchChatWorker(this.value)" style="padding: 8px 12px; border-radius: 8px; background: #08111f; color: var(--text); border: 1px solid var(--line); font-weight: 700;">
          <option value="worker1">Worker 1</option>
          <option value="worker2">Worker 2</option>
          <option value="worker3">Worker 3</option>
        </select>
      </div>

      <div id="adminChatContainer" style="background: #08111f; border: 1px solid var(--line); border-radius: 12px; height: 320px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
        <!-- Chat messages render here -->
      </div>

      <form id="adminChatForm" onsubmit="event.preventDefault(); sendAdminChat();" style="display: flex; gap: 10px; margin-top: 12px;">
        <input type="text" id="adminChatInput" placeholder="Type a message..." style="flex: 1; margin: 0;" required autocomplete="off">
        <button type="submit" class="btn" style="min-width: 90px;">Send</button>
      </form>
    </section>
  </main>

  <!-- Reset Confirmation Modal -->
  <div id="resetModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="resetModalTitle" style="color: #EF4444; margin-bottom: 12px;">Reset Worker Time?</h3>
      <p id="resetModalBody" style="font-size: 14px; margin-bottom: 16px; line-height: 1.5;"></p>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn secondary" onclick="closeResetModal()">CANCEL</button>
        <button class="btn danger" id="resetModalConfirmBtn" style="background: #EF4444; color: white;">RESET TIME</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let workers = [], socket, iceServers = [];
    const peers = new Map(), requested = new Map(), activeRecorders = new Map();
    const liveModes = new Map();
    const workerAudio = new Map(); // workerId -> boolean
    const pingStatusMap = new Map(); // workerId -> string
    let pendingResetWorkerId = null;

    async function api(path, body) {
      const r = await fetch(path, {
        method: body ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      if (r.status === 401 || r.status === 403) {
        location.href = '/';
        throw Error('Sign in required');
      }
      const d = await r.json();
      if (!r.ok) throw Error(d.error || 'Request failed');
      return d;
    }

    function fmt(ms) {
      const t = Math.floor(Math.max(0, ms) / 1000);
      return [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60].map(x => String(x).padStart(2, '0')).join(':');
    }

    function calcPay(ms) {
      const hours = Math.max(0, ms) / 3600000.0;
      return (hours * 7.0).toFixed(2);
    }

    function formatLastSeen(timestamp) {
      if (!timestamp) return 'Never';
      const diffSec = Math.floor((Date.now() - timestamp) / 1000);
      if (diffSec < 10) return 'Just now';
      if (diffSec < 60) return `${diffSec}s ago`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m ago`;
      const diffHours = Math.floor(diffMin / 60);
      return `${diffHours}h ago`;
    }

    function closePeer(id) {
      if (activeRecorders.has(id)) {
        const session = activeRecorders.get(id);
        activeRecorders.delete(id);
        try { session.recorder.stop(); } catch (_) {}
      }

      const p = peers.get(id);
      if (p?.pc) p.pc.close();
      peers.delete(id);
      const v = document.getElementById('video-' + id);
      if (v) v.srcObject = null;
      requested.delete(id);
      liveModes.set(id, 'NONE');
    }

    function toggleRecord(id, name) {
      const card = document.getElementById(id);
      const btn = card?.querySelector('.btn-record');
      const video = document.getElementById('video-' + id);

      if (activeRecorders.has(id)) {
        const session = activeRecorders.get(id);
        activeRecorders.delete(id);
        try { session.recorder.stop(); } catch (_) {}
        if (btn) {
          btn.textContent = '● RECORD';
          btn.classList.remove('btn-record-active');
          btn.style.background = '';
        }
        return;
      }

      const stream = video?.srcObject;
      if (!stream || !stream.getTracks().length) {
        alert('No active video stream to record. Start the live camera stream first.');
        return;
      }

      const chunks = [];
      const mimeTypes = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
      ];
      const selectedType = mimeTypes.find(t => typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) || '';

      let recorder;
      try {
        recorder = new MediaRecorder(stream, selectedType ? { mimeType: selectedType } : {});
      } catch (e) {
        alert('Recording error: ' + e.message);
        return;
      }

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        if (!chunks.length) return;
        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
        const sanitizeName = (name || 'Worker').replace(/[^a-zA-Z0-9_-]/g, '');
        const fileName = `WorkTimer_${sanitizeName}_${dateStr}.mp4`;

        const reader = new FileReader();
        reader.onloadend = () => {
          const base64Data = reader.result;
          if (window.AndroidAdmin && window.AndroidAdmin.saveRecording) {
            window.AndroidAdmin.saveRecording(fileName, base64Data);
          } else {
            const a = document.createElement('a');
            a.href = base64Data;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
              document.body.removeChild(a);
            }, 1000);
          }
        };
        reader.readAsDataURL(blob);

        if (card) {
          const liveEl = card.querySelector('.live');
          if (liveEl) liveEl.textContent = 'Recording saved: ' + fileName;
        }
      };

      recorder.start(1000);
      activeRecorders.set(id, { recorder, chunks });

      if (btn) {
        btn.textContent = '■ STOP RECORDING';
        btn.classList.add('btn-record-active');
      }
      if (card) {
        const liveEl = card.querySelector('.live');
        if (liveEl) liveEl.textContent = '● RECORDING LIVE BROADCAST…';
      }
    }

    function openResetModal(workerId, name, currentTimeStr) {
      pendingResetWorkerId = workerId;
      document.getElementById('resetModalTitle').textContent = `Reset ${name} Time?`;
      document.getElementById('resetModalBody').innerHTML = `
        Current recorded time: <strong>${currentTimeStr}</strong><br><br>
        This will reset the current timer to <strong>00:00:00</strong>.<br><br>
        If the worker is currently WORKING, the timer will continue from 00:00:00.
      `;
      document.getElementById('resetModal').style.display = 'flex';
    }

    function closeResetModal() {
      pendingResetWorkerId = null;
      document.getElementById('resetModal').style.display = 'none';
    }

    document.getElementById('resetModalConfirmBtn').onclick = () => {
      if (pendingResetWorkerId) {
        socket.emit('admin-reset-time', { workerId: pendingResetWorkerId });
      }
      closeResetModal();
    };

    function update() {
      for (const w of workers) {
        let c = document.getElementById(w.id);
        if (!c) {
          c = document.createElement('article');
          c.id = w.id;
          c.className = 'card worker-card';
          c.innerHTML = `
            <h2></h2>
            <video autoplay playsinline muted></video>
            <div class="timer">00:00:00</div>
            <div class="est-pay">Estimated Pay: $0.00</div>
            <p class="state"></p>
            <p class="ping-status" style="font-size: 12px; color: #A0C8B6; margin: 2px 0 6px;"></p>
            <p class="live" style="min-height: 20px; font-weight: 600;"></p>

            <div class="controls-group">
              <button class="btn btn-sm btn-camera-start" style="flex:1;">Start Camera</button>
              <button class="btn btn-sm secondary btn-camera-stop" style="flex:1;">Stop Camera</button>
            </div>

            <div class="controls-group">
              <button class="btn btn-sm secondary btn-front" style="flex:1;">Front Camera</button>
              <button class="btn btn-sm secondary btn-back" style="flex:1;">Back Camera</button>
            </div>

            <div class="controls-group">
              <button class="btn btn-sm btn-screen-start" style="flex:1;">Start Screen Share</button>
              <button class="btn btn-sm danger btn-screen-stop" style="background: #ef4444; color: white; border: none; flex:1;">Stop Screen Share</button>
            </div>

            <div class="controls-group">
              <button class="btn btn-sm btn-audio" style="flex:1;">AUDIO OFF</button>
              <button class="btn btn-sm secondary btn-ping" style="flex:1;">PING WORKER</button>
            </div>

            <div class="controls-group">
              <button class="btn btn-sm btn-record" style="background: #059669; color: white; flex:1;">● RECORD</button>
            </div>

            <div class="controls-group">
              <button class="btn btn-sm btn-timer-action" style="flex:2;">Start Time</button>
              <button class="btn btn-sm secondary btn-timer-stop">Stop Time</button>
            </div>

            <div class="controls-group">
              <button class="btn btn-sm danger btn-reset-time" style="background: #ef4444; color: white; border: none; flex:1;">RESET TIME</button>
              <button class="btn btn-sm secondary btn-history" style="flex:1;">History</button>
            </div>

            <p class="history"></p>
          `;

          c.querySelector('video').id = 'video-' + w.id;
          document.getElementById('workers').append(c);

          const workerId = w.id;

          // Per-worker Audio button
          c.querySelector('.btn-audio').onclick = () => {
            const isAudioOn = !workerAudio.get(workerId);
            workerAudio.set(workerId, isAudioOn);

            const btnAudio = c.querySelector('.btn-audio');
            btnAudio.textContent = isAudioOn ? 'AUDIO ON' : 'AUDIO OFF';
            btnAudio.style.background = isAudioOn ? '#10B981' : '';
            btnAudio.style.color = isAudioOn ? '#FFFFFF' : '';

            const video = document.getElementById('video-' + workerId);
            if (video) {
              video.muted = !isAudioOn;
              if (isAudioOn) video.play().catch(() => {});
            }
          };

          // Ping button
          c.querySelector('.btn-ping').onclick = () => {
            const current = workers.find(x => x.id === workerId);
            if (!current) return;
            pingStatusMap.set(workerId, 'Pinging worker…');
            c.querySelector('.ping-status').textContent = 'Pinging worker…';

            const nonce = 'ping_' + Date.now();
            socket.emit('admin-ping-worker', { workerId, nonce });

            setTimeout(() => {
              if (pingStatusMap.get(workerId) === 'Pinging worker…') {
                const lastSeen = current.lastSeenAt ? formatLastSeen(current.lastSeenAt) : 'Never';
                const msg = `No response · Last seen: ${lastSeen}`;
                pingStatusMap.set(workerId, msg);
                c.querySelector('.ping-status').textContent = msg;
              }
            }, 5000);
          };

          // Front Camera button
          c.querySelector('.btn-front').onclick = () => {
            socket.emit('admin-switch-camera', { workerId, camera: 'front', facing: 'front' });
            c.querySelector('.live').textContent = 'Switching to Front Camera…';
          };

          // Back Camera button
          c.querySelector('.btn-back').onclick = () => {
            socket.emit('admin-switch-camera', { workerId, camera: 'back', facing: 'back' });
            c.querySelector('.live').textContent = 'Switching to Back Camera…';
          };

          // Record button
          c.querySelector('.btn-record').onclick = () => {
            const current = workers.find(x => x.id === workerId);
            if (!current) return;
            toggleRecord(workerId, current.name);
          };

          // Start Camera button (handles CAMERA <-> SCREEN switching)
          c.querySelector('.btn-camera-start').onclick = () => {
            const current = workers.find(x => x.id === workerId);
            if (!current) return;

            if (current.liveMode === 'SCREEN' || current.liveMode === 'SCREEN_PENDING') {
              c.querySelector('.live').textContent = 'Switching to Camera…';
              closePeer(workerId);
            } else {
              c.querySelector('.live').textContent = 'Connecting camera…';
            }

            requested.set(workerId, Date.now());
            socket.emit('admin-live-request', { workerId, mode: 'camera' });
          };

          // Stop Camera button
          c.querySelector('.btn-camera-stop').onclick = () => {
            socket.emit('admin-live-stop', { workerId });
            closePeer(workerId);
            requested.set(workerId, Date.now() + 31536000000);
            c.querySelector('.live').textContent = 'Camera feed stopped';
          };

          // Start Screen Share button (handles CAMERA <-> SCREEN switching)
          c.querySelector('.btn-screen-start').onclick = () => {
            const current = workers.find(x => x.id === workerId);
            if (!current) return;

            if (current.liveMode === 'CAMERA' || current.liveMode === 'CAMERA_PENDING') {
              c.querySelector('.live').textContent = 'Switching to Screen…';
              closePeer(workerId);
            } else {
              c.querySelector('.live').textContent = 'Waiting for worker screen-share approval…';
            }

            requested.set(workerId, Date.now());
            socket.emit('admin-live-request', { workerId, mode: 'screen' });
          };

          // Stop Screen Share button
          c.querySelector('.btn-screen-stop').onclick = () => {
            socket.emit('admin-live-stop', { workerId });
            closePeer(workerId);
            requested.set(workerId, Date.now() + 31536000000);
            c.querySelector('.live').textContent = 'Screen Share stopped';
          };

          // Start/Pause/Resume Timer button
          c.querySelector('.btn-timer-action').onclick = () => {
            const current = workers.find(x => x.id === workerId);
            if (!current) return;
            const action = current.status === 'WORKING' ? 'pause' : current.status === 'PAUSED' ? 'resume' : 'start';
            socket.emit('admin-timer-control', { workerId, action });
          };

          // Stop Timer button
          c.querySelector('.btn-timer-stop').onclick = () => {
            socket.emit('admin-timer-control', { workerId, action: 'stop' });
          };

          // Reset Time button
          c.querySelector('.btn-reset-time').onclick = () => {
            const current = workers.find(x => x.id === workerId);
            if (!current) return;
            const elapsed = (current.accumulatedMs || 0) + (current.status === 'WORKING' && current.startedAt ? Date.now() - current.startedAt : 0);
            openResetModal(workerId, current.name, fmt(elapsed));
          };

          // History button
          c.querySelector('.btn-history').onclick = async () => {
            try {
              const d = await api('/api/work-sessions/' + workerId);
              c.querySelector('.history').textContent = d.sessions.map(s =>
                new Date(s.startedAt).toLocaleString() + ' | ' + (s.endedAt ? fmt(s.durationMs) : 'Active shift')
              ).join('\n') || 'No completed shifts';
            } catch (e) {
              c.querySelector('.history').textContent = e.message;
            }
          };
        }

        // Update Text and Values
        c.querySelector('h2').textContent = w.name;
        c.querySelector('.state').textContent = w.status + ' · ' + (w.online ? 'Connected' : 'Offline');

        const elapsedMs = (w.accumulatedMs || 0) + (w.status === 'WORKING' && w.startedAt ? Date.now() - w.startedAt : 0);
        c.querySelector('.timer').textContent = fmt(elapsedMs);
        c.querySelector('.est-pay').textContent = `Estimated Pay: $${calcPay(elapsedMs)}`;

        // Ping status text
        if (!pingStatusMap.has(w.id)) {
          c.querySelector('.ping-status').textContent = w.lastSeenAt ? `Last seen: ${formatLastSeen(w.lastSeenAt)}` : '';
        } else {
          c.querySelector('.ping-status').textContent = pingStatusMap.get(w.id);
        }

        // Video Muted state based on per-worker audio setting
        const video = document.getElementById('video-' + w.id);
        const isAudioOn = !!workerAudio.get(w.id);
        if (video) video.muted = !isAudioOn;

        // Button states
        const btnCamStart = c.querySelector('.btn-camera-start');
        const btnCamStop = c.querySelector('.btn-camera-stop');
        const btnFront = c.querySelector('.btn-front');
        const btnBack = c.querySelector('.btn-back');
        const btnScreenStart = c.querySelector('.btn-screen-start');
        const btnScreenStop = c.querySelector('.btn-screen-stop');

        if (!w.online) {
          btnCamStart.disabled = true;
          btnCamStop.disabled = true;
          btnFront.disabled = true;
          btnBack.disabled = true;
          btnScreenStart.disabled = true;
          btnScreenStop.disabled = true;
        } else if (w.liveMode === 'NONE') {
          btnCamStart.disabled = !w.captureReady;
          btnCamStop.disabled = true;
          btnFront.disabled = true;
          btnBack.disabled = true;
          btnScreenStart.disabled = false;
          btnScreenStop.disabled = true;
        } else if (w.liveMode === 'CAMERA' || w.liveMode === 'CAMERA_PENDING') {
          btnCamStart.disabled = true;
          btnCamStop.disabled = false;
          btnFront.disabled = false;
          btnBack.disabled = false;
          btnScreenStart.disabled = false; // Allow switching to Screen directly!
          btnScreenStop.disabled = true;
        } else if (w.liveMode === 'SCREEN' || w.liveMode === 'SCREEN_PENDING') {
          btnCamStart.disabled = false; // Allow switching to Camera directly!
          btnCamStop.disabled = true;
          btnFront.disabled = true;
          btnBack.disabled = true;
          btnScreenStart.disabled = true;
          btnScreenStop.disabled = false;
        }

        // Record button
        const btnRecord = c.querySelector('.btn-record');
        btnRecord.disabled = !w.online || (w.liveMode !== 'CAMERA' && w.liveMode !== 'SCREEN');

        // Timer action button text
        const btnTimerAction = c.querySelector('.btn-timer-action');
        btnTimerAction.textContent = w.status === 'WORKING' ? 'Pause Time' : w.status === 'PAUSED' ? 'Resume Time' : 'Start Time';
        btnTimerAction.disabled = !w.online;

        // Timer stop button
        const btnTimerStop = c.querySelector('.btn-timer-stop');
        btnTimerStop.disabled = !w.online || (w.status !== 'WORKING' && w.status !== 'PAUSED');

        if (!w.online) {
          closePeer(w.id);
          c.querySelector('.live').textContent = 'Worker offline';
          continue;
        }
      }
    }

    document.getElementById('logout').onclick = async () => {
      await api('/api/logout', {});
      location.href = '/';
    };

    (async () => {
      const me = await api('/api/me');
      if (me.user.role !== 'admin') {
        location.href = '/worker.html';
        return;
      }
      iceServers = (await api('/api/rtc-config')).iceServers;
      socket = io();

      socket.on('connect', () => {
        document.getElementById('message').textContent = 'Connected';
        for (const id of [...peers.keys()]) closePeer(id);
        requested.clear();
        update();
      });

      socket.on('workers-state', data => {
        workers = data;
        update();
      });

      socket.on('worker-ping-result', p => {
        if (p.ok) {
          pingStatusMap.set(p.workerId, 'Last response: Just now');
        } else {
          const w = workers.find(x => x.id === p.workerId);
          const lastSeen = w?.lastSeenAt ? formatLastSeen(w.lastSeenAt) : 'Never';
          pingStatusMap.set(p.workerId, `No response · Last seen: ${lastSeen}`);
        }
        update();
      });

      socket.on('disconnect', () => {
        document.getElementById('message').textContent = 'Reconnecting…';
        for (const id of [...peers.keys()]) closePeer(id);
        requested.clear();
      });

      socket.on('rtc-offer', async p => {
        liveModes.set(p.workerId, p.mode === 'screen' ? 'SCREEN' : 'CAMERA');
        const early = peers.get(p.workerId)?.ice || [];
        closePeer(p.workerId);
        const pc = new RTCPeerConnection({ iceServers });
        const entry = { pc, ice: early };
        peers.set(p.workerId, entry);

        pc.ontrack = e => {
          const v = document.getElementById('video-' + p.workerId);
          v.srcObject = e.streams[0] || new MediaStream(e.track ? [e.track] : []);
          const isAudioOn = !!workerAudio.get(p.workerId);
          v.muted = !isAudioOn;
          v.play().catch(() => {});
          const card = document.getElementById(p.workerId);
          if (card) {
            const currentMode = liveModes.get(p.workerId);
            card.querySelector('.live').textContent = currentMode === 'SCREEN' ? 'Screen Share LIVE' : 'Camera feed LIVE';
          }
        };

        pc.onicecandidate = e => {
          if (e.candidate) socket.emit('rtc-ice', { targetSocketId: p.workerSocketId, workerId: p.workerId, candidate: e.candidate });
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'failed') {
            socket.emit('admin-live-stop', { workerId: p.workerId });
            closePeer(p.workerId);
            const card = document.getElementById(p.workerId);
            if (card) card.querySelector('.live').textContent = 'Connection failed; check TURN settings';
            requested.set(p.workerId, Date.now() + 20000);
          }
        };

        try {
          await pc.setRemoteDescription(p.offer);
          for (const ice of entry.ice) {
            try { await pc.addIceCandidate(ice); } catch (_) {}
          }
          entry.ice = [];
          await pc.setLocalDescription(await pc.createAnswer());
          socket.emit('rtc-answer', { targetSocketId: p.workerSocketId, workerId: p.workerId, answer: pc.localDescription });
        } catch (e) {
          document.getElementById('message').textContent = e.message;
          socket.emit('admin-live-stop', { workerId: p.workerId });
          closePeer(p.workerId);
        }
      });

      socket.on('rtc-ice', async p => {
        let entry = peers.get(p.workerId);
        if (!entry) {
          entry = { pc: null, ice: [] };
          peers.set(p.workerId, entry);
        }
        if (!entry.pc?.remoteDescription) entry.ice.push(p.candidate);
        else try { await entry.pc.addIceCandidate(p.candidate); } catch (e) { document.getElementById('message').textContent = e.message; }
      });

      socket.on('live-error', p => {
        closePeer(p.workerId);
        requested.set(p.workerId, Date.now());
        const c = document.getElementById(p.workerId);
        if (c) c.querySelector('.live').textContent = p.message;
      });

      socket.on('live-status', p => {
        if (p.mode === 'NONE') closePeer(p.workerId);
      });

      socket.on('task:assigned', () => loadTasks());
      socket.on('task:submitted', () => loadTasks());
      socket.on('task:approved', () => loadTasks());
      socket.on('task:returned', () => loadTasks());
      socket.on('task:updated', () => loadTasks());
      socket.on('chat:message', (msg) => {
        if (msg.workerId === activeChatWorkerId) {
          loadChat();
        }
      });

      loadTasks();
      loadChat();

      setInterval(() => {
        for (const [id, at] of requested) if (Date.now() - at > 30000) requested.delete(id);
        update();
      }, 500);
    })().catch(e => document.getElementById('message').textContent = e.message);

    // Tasks JS Functions
    async function loadTasks() {
      const workerFilter = document.getElementById('filterTaskWorker')?.value || '';
      const url = workerFilter ? `/api/tasks?workerId=${workerFilter}` : '/api/tasks';
      try {
        const data = await api(url);
        renderTasks(data.tasks || []);
      } catch (e) {
        const container = document.getElementById('adminTaskList');
        if (container) container.innerHTML = `<p class="muted">Error loading tasks: ${e.message}</p>`;
      }
    }

    function statusBadge(status) {
      const colors = {
        'ASSIGNED': '#3B82F6',
        'IN_PROGRESS': '#F59E0B',
        'SUBMITTED': '#8B5CF6',
        'COMPLETED': '#10B981',
        'RETURNED': '#EF4444'
      };
      const labels = {
        'ASSIGNED': 'Assigned',
        'IN_PROGRESS': 'In Progress',
        'SUBMITTED': 'Submitted — Review Needed',
        'COMPLETED': 'Completed ✓',
        'RETURNED': 'Returned'
      };
      const c = colors[status] || '#6B7280';
      const l = labels[status] || status;
      return `<span style="background: ${c}22; color: ${c}; border: 1px solid ${c}55; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;">${l}</span>`;
    }

    function getWorkerDisplayName(workerId) {
      if (workerId === 'worker1') return 'Worker 1';
      if (workerId === 'worker2') return 'Worker 2';
      if (workerId === 'worker3') return 'Worker 3';
      return workerId;
    }

    function renderTasks(tasks) {
      const container = document.getElementById('adminTaskList');
      if (!container) return;
      if (!tasks.length) {
        container.innerHTML = `<p class="muted">No tasks found.</p>`;
        return;
      }
      container.innerHTML = tasks.slice().reverse().map(t => {
        const dueText = t.dueAt ? ` | Due: ${t.dueAt}` : '';
        let actions = '';
        if (t.status === 'SUBMITTED') {
          actions = `
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button class="btn btn-sm" onclick="approveTask('${t.taskId || t.id}')" style="background: #10B981; color: white;">APPROVE COMPLETED</button>
              <button class="btn btn-sm danger" onclick="returnTaskPrompt('${t.taskId || t.id}')">RETURN TASK</button>
            </div>
          `;
        }
        const noteHtml = t.adminNote ? `<p style="color: #EF4444; margin-top: 6px; font-size: 12px;"><strong>Admin Note:</strong> ${t.adminNote}</p>` : '';
        return `
          <div style="background: var(--panel-2); padding: 12px; border-radius: 10px; border: 1px solid var(--line);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <strong style="font-size: 15px;">${t.title}</strong>
                <span class="muted" style="font-size: 12px; display: block; margin-top: 2px;">Assigned to: ${getWorkerDisplayName(t.workerId)}${dueText}</span>
              </div>
              ${statusBadge(t.status)}
            </div>
            ${t.description ? `<p style="margin-top: 8px; font-size: 13px; color: var(--text);">${t.description}</p>` : ''}
            ${noteHtml}
            ${actions}
          </div>
        `;
      }).join('');
    }

    async function assignTask() {
      const workerId = document.getElementById('taskWorkerId').value;
      const title = document.getElementById('taskTitle').value;
      const description = document.getElementById('taskDesc').value;
      const dateVal = document.getElementById('taskDueDate').value;
      const timeVal = document.getElementById('taskDueTime').value;

      let dueAt = '';
      if (dateVal) {
        dueAt = dateVal + (timeVal ? ` ${timeVal}` : '');
      }

      try {
        await api('/api/tasks', { workerId, title, description, dueAt });
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        document.getElementById('taskDueDate').value = '';
        document.getElementById('taskDueTime').value = '';
        loadTasks();
      } catch (e) {
        alert('Error assigning task: ' + e.message);
      }
    }

    async function approveTask(taskId) {
      try {
        await api(`/api/tasks/${taskId}/approve`, {});
        loadTasks();
      } catch (e) {
        alert('Error approving task: ' + e.message);
      }
    }

    async function returnTaskPrompt(taskId) {
      const note = prompt('Enter Admin Note for returning this task:');
      if (note === null) return;
      try {
        await api(`/api/tasks/${taskId}/return`, { adminNote: note });
        loadTasks();
      } catch (e) {
        alert('Error returning task: ' + e.message);
      }
    }

    let activeChatWorkerId = 'worker1';

    function switchChatWorker(workerId) {
      activeChatWorkerId = workerId;
      loadChat();
    }

    async function loadChat() {
      const workerId = activeChatWorkerId;
      try {
        const data = await api(`/api/chat/${workerId}`);
        renderChatMessages(data.messages || []);
      } catch (e) {
        const container = document.getElementById('adminChatContainer');
        if (container) container.innerHTML = `<p class="muted">Error loading chat: ${e.message}</p>`;
      }
    }

    function renderChatMessages(messages) {
      const container = document.getElementById('adminChatContainer');
      if (!container) return;
      if (!messages.length) {
        container.innerHTML = `<p class="muted" style="margin: auto;">No messages yet with ${getWorkerDisplayName(activeChatWorkerId)}.</p>`;
        return;
      }
      container.innerHTML = messages.map(m => {
        const isAdmin = m.senderRole === 'ADMIN';
        const align = isAdmin ? 'flex-end' : 'flex-start';
        const bg = isAdmin ? '#1E3A8A' : '#1F2937';
        const senderLabel = isAdmin ? 'Admin' : getWorkerDisplayName(m.workerId);
        const timeStr = new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `
          <div style="align-self: ${align}; max-width: 75%; background: ${bg}; padding: 8px 12px; border-radius: 12px; color: #fff; font-size: 13px;">
            <div style="font-size: 11px; opacity: 0.7; margin-bottom: 2px;">${senderLabel} · ${timeStr}</div>
            <div>${m.message}</div>
          </div>
        `;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    async function sendAdminChat() {
      const input = document.getElementById('adminChatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      try {
        await api(`/api/chat/${activeChatWorkerId}/messages`, { message: text });
        loadChat();
      } catch (e) {
        alert('Error sending message: ' + e.message);
      }
    }
  </script>
</body>
</html>
