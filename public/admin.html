<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work Timer Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .wrap { width: min(1200px, 100%); margin: 0 auto; padding: 24px 18px 44px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { padding: 20px; }
    video { width: 100%; background: #02050a; border-radius: 12px; aspect-ratio: 4/3; }
    .timer { font-size: 38px; margin: 12px 0 8px; }
    .history { white-space: pre-wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
    .tools { display: flex; gap: 12px; margin: 20px 0; }
    .controls-group { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    .controls-group .btn { flex: 1; min-width: 90px; }

    @keyframes pulse-red {
      0% { background-color: #EF4444; }
      50% { background-color: #B91C1C; }
      100% { background-color: #EF4444; }
    }

    .btn-record-active {
      animation: pulse-red 1.5s infinite;
      color: #FFFFFF !important;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Work Timer Admin</h1>
    <p class="muted">Worker camera control & recording panel. Admin manages video feeds, front/back cameras, and broadcast recordings below.</p>
    <div class="tools">
      <button class="btn" id="audio">Enable Audio</button>
      <button class="btn secondary" id="logout">Log Out</button>
    </div>
    <p id="message">Connecting…</p>
    <section id="workers" class="grid"></section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let workers = [], socket, iceServers = [], audioEnabled = false;
    const peers = new Map(), requested = new Map(), activeRecorders = new Map();

    async function api(path, body) {
      const r = await fetch(path, {
        method: body ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      if (r.status === 401 || r.status === 403) {
        location.href = '/';
        throw Error('Sign in required');
      }
      const d = await r.json();
      if (!r.ok) throw Error(d.error || 'Request failed');
      return d;
    }

    function fmt(ms) {
      const t = Math.floor(Math.max(0, ms) / 1000);
      return [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60].map(x => String(x).padStart(2, '0')).join(':');
    }

    function closePeer(id) {
      if (activeRecorders.has(id)) {
        const session = activeRecorders.get(id);
        activeRecorders.delete(id);
        try { session.recorder.stop(); } catch (_) {}
      }

      const p = peers.get(id);
      if (p?.pc) p.pc.close();
      peers.delete(id);
      const v = document.getElementById('video-' + id);
      if (v) v.srcObject = null;
      requested.delete(id);
    }

    function toggleRecord(id, name) {
      const card = document.getElementById(id);
      const btn = card?.querySelector('.btn-record');
      const video = document.getElementById('video-' + id);

      if (activeRecorders.has(id)) {
        const session = activeRecorders.get(id);
        activeRecorders.delete(id);
        try { session.recorder.stop(); } catch (_) {}
        if (btn) {
          btn.textContent = '● RECORD';
          btn.classList.remove('btn-record-active');
          btn.style.background = '';
        }
        return;
      }

      const stream = video?.srcObject;
      if (!stream || !stream.getTracks().length) {
        alert('No active video stream to record. Start the live camera stream first.');
        return;
      }

      const chunks = [];
      const mimeTypes = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
      ];
      const selectedType = mimeTypes.find(t => typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) || '';

      let recorder;
      try {
        recorder = new MediaRecorder(stream, selectedType ? { mimeType: selectedType } : {});
      } catch (e) {
        alert('Recording error: ' + e.message);
        return;
      }

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        if (!chunks.length) return;
        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
        const sanitizeName = (name || 'Worker').replace(/[^a-zA-Z0-9_-]/g, '');
        const fileName = `WorkTimer_${sanitizeName}_${dateStr}.mp4`;

        const reader = new FileReader();
        reader.onloadend = () => {
          const base64Data = reader.result;
          if (window.AndroidAdmin && window.AndroidAdmin.saveRecording) {
            window.AndroidAdmin.saveRecording(fileName, base64Data);
          } else {
            const a = document.createElement('a');
            a.href = base64Data;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
              document.body.removeChild(a);
            }, 1000);
          }
        };
        reader.readAsDataURL(blob);

        if (card) {
          const liveEl = card.querySelector('.live');
          if (liveEl) liveEl.textContent = 'Recording saved: ' + fileName;
        }
      };

      recorder.start(1000);
      activeRecorders.set(id, { recorder, chunks });

      if (btn) {
        btn.textContent = '■ STOP RECORDING';
        btn.classList.add('btn-record-active');
      }
      if (card) {
        const liveEl = card.querySelector('.live');
        if (liveEl) liveEl.textContent = '● RECORDING LIVE BROADCAST…';
      }
    }

    function update() {
      for (const w of workers) {
        let c = document.getElementById(w.id);
        if (!c) {
          c = document.createElement('article');
          c.id = w.id;
          c.className = 'card worker-card';
          c.innerHTML = `
            <h2></h2>
            <video autoplay playsinline muted></video>
            <div class="timer">00:00:00</div>
            <p class="state"></p>
            <p class="live" style="min-height: 20px; font-weight: 600;"></p>

            <div class="controls-group">
              <button class="btn btn-sm secondary btn-front">FRONT</button>
              <button class="btn btn-sm secondary btn-back">BACK</button>
              <button class="btn btn-sm btn-record" style="background: #059669; color: white;">● RECORD</button>
            </div>

            <div class="controls-group">
              <button class="btn btn-sm btn-live" style="flex:2;">Start Live</button>
              <button class="btn btn-sm secondary btn-timer-stop">Stop Time</button>
            </div>

            <div class="controls-group">
              <button class="btn btn-sm btn-timer-action" style="flex:2;">Start Time</button>
              <button class="btn btn-sm secondary btn-history">History</button>
            </div>

            <p class="history"></p>
          `;

          c.querySelector('video').id = 'video-' + w.id;
          document.getElementById('workers').append(c);

          c.querySelector('.btn-front').onclick = () => {
            socket.emit('admin-switch-camera', { workerId: w.id, camera: 'front', facing: 'front' });
            c.querySelector('.live').textContent = 'Switching to Front Camera…';
          };

          c.querySelector('.btn-back').onclick = () => {
            socket.emit('admin-switch-camera', { workerId: w.id, camera: 'back', facing: 'back' });
            c.querySelector('.live').textContent = 'Switching to Back Camera…';
          };

          c.querySelector('.btn-record').onclick = () => {
            toggleRecord(w.id, w.name);
          };

          c.querySelector('.btn-live').onclick = () => {
            if (w.liveMode === 'NONE') {
              requested.set(w.id, Date.now());
              socket.emit('admin-live-request', { workerId: w.id, mode: 'camera' });
              c.querySelector('.live').textContent = 'Connecting camera and audio…';
            } else {
              socket.emit('admin-live-stop', { workerId: w.id });
              closePeer(w.id);
              c.querySelector('.live').textContent = 'Live camera stopped';
            }
          };

          c.querySelector('.btn-timer-action').onclick = () => {
            const action = w.status === 'WORKING' ? 'pause' : w.status === 'PAUSED' ? 'resume' : 'start';
            socket.emit('admin-timer-control', { workerId: w.id, action });
          };

          c.querySelector('.btn-timer-stop').onclick = () => {
            socket.emit('admin-timer-control', { workerId: w.id, action: 'stop' });
          };

          c.querySelector('.btn-history').onclick = async () => {
            try {
              const d = await api('/api/work-sessions/' + w.id);
              c.querySelector('.history').textContent = d.sessions.map(s =>
                new Date(s.startedAt).toLocaleString() + ' | ' + (s.endedAt ? fmt(s.durationMs) : 'Active shift')
              ).join('\n') || 'No completed shifts';
            } catch (e) {
              c.querySelector('.history').textContent = e.message;
            }
          };
        }

        c.querySelector('h2').textContent = w.name;
        c.querySelector('.state').textContent = w.status + ' · ' + (w.online ? 'Connected' : 'Offline');
        c.querySelector('.timer').textContent = fmt((w.accumulatedMs || 0) + (w.status === 'WORKING' && w.startedAt ? Date.now() - w.startedAt : 0));

        const btnLive = c.querySelector('.btn-live');
        btnLive.textContent = w.liveMode === 'NONE' ? 'Start Live' : 'Stop Live';
        btnLive.disabled = !w.online || !w.captureReady;

        const btnFront = c.querySelector('.btn-front');
        const btnBack = c.querySelector('.btn-back');
        btnFront.disabled = !w.online;
        btnBack.disabled = !w.online;

        const btnRecord = c.querySelector('.btn-record');
        btnRecord.disabled = !w.online || w.liveMode === 'NONE';

        const btnTimerAction = c.querySelector('.btn-timer-action');
        btnTimerAction.textContent = w.status === 'WORKING' ? 'Pause Time' : w.status === 'PAUSED' ? 'Resume Time' : 'Start Time';
        btnTimerAction.disabled = !w.online;

        const btnTimerStop = c.querySelector('.btn-timer-stop');
        btnTimerStop.disabled = !w.online || (w.status !== 'WORKING' && w.status !== 'PAUSED');

        if (!w.online) {
          closePeer(w.id);
          c.querySelector('.live').textContent = 'Camera offline';
          continue;
        }

        if (socket?.connected && w.captureReady && w.liveMode === 'NONE' && !peers.has(w.id) && !requested.has(w.id)) {
          requested.set(w.id, Date.now());
          socket.emit('admin-live-request', { workerId: w.id, mode: 'camera' });
          c.querySelector('.live').textContent = 'Connecting camera and audio…';
        }
      }
    }

    document.getElementById('audio').onclick = () => {
      audioEnabled = true;
      document.querySelectorAll('video').forEach(v => {
        v.muted = false;
        v.play().catch(() => {});
      });
      document.getElementById('audio').textContent = 'Audio enabled';
    };

    document.getElementById('logout').onclick = async () => {
      await api('/api/logout', {});
      location.href = '/';
    };

    (async () => {
      const me = await api('/api/me');
      if (me.user.role !== 'admin') {
        location.href = '/worker.html';
        return;
      }
      iceServers = (await api('/api/rtc-config')).iceServers;
      socket = io();

      socket.on('connect', () => {
        document.getElementById('message').textContent = 'Connected';
        for (const id of [...peers.keys()]) closePeer(id);
        requested.clear();
        update();
      });

      socket.on('workers-state', data => {
        workers = data;
        update();
      });

      socket.on('disconnect', () => {
        document.getElementById('message').textContent = 'Reconnecting…';
        for (const id of [...peers.keys()]) closePeer(id);
        requested.clear();
      });

      socket.on('rtc-offer', async p => {
        const early = peers.get(p.workerId)?.ice || [];
        closePeer(p.workerId);
        const pc = new RTCPeerConnection({ iceServers });
        const entry = { pc, ice: early };
        peers.set(p.workerId, entry);

        pc.ontrack = e => {
          const v = document.getElementById('video-' + p.workerId);
          v.srcObject = e.streams[0] || new MediaStream(e.track ? [e.track] : []);
          v.muted = !audioEnabled;
          v.play().catch(() => {});
          const card = document.getElementById(p.workerId);
          if (card) card.querySelector('.live').textContent = 'Live camera + audio';
        };

        pc.onicecandidate = e => {
          if (e.candidate) socket.emit('rtc-ice', { targetSocketId: p.workerSocketId, workerId: p.workerId, candidate: e.candidate });
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'failed') {
            socket.emit('admin-live-stop', { workerId: p.workerId });
            closePeer(p.workerId);
            const card = document.getElementById(p.workerId);
            if (card) card.querySelector('.live').textContent = 'Connection failed; check TURN settings';
            requested.set(p.workerId, Date.now() + 20000);
          }
        };

        try {
          await pc.setRemoteDescription(p.offer);
          for (const ice of entry.ice) {
            try { await pc.addIceCandidate(ice); } catch (_) {}
          }
          entry.ice = [];
          await pc.setLocalDescription(await pc.createAnswer());
          socket.emit('rtc-answer', { targetSocketId: p.workerSocketId, workerId: p.workerId, answer: pc.localDescription });
        } catch (e) {
          document.getElementById('message').textContent = e.message;
          socket.emit('admin-live-stop', { workerId: p.workerId });
          closePeer(p.workerId);
        }
      });

      socket.on('rtc-ice', async p => {
        let entry = peers.get(p.workerId);
        if (!entry) {
          entry = { pc: null, ice: [] };
          peers.set(p.workerId, entry);
        }
        if (!entry.pc?.remoteDescription) entry.ice.push(p.candidate);
        else try { await entry.pc.addIceCandidate(p.candidate); } catch (e) { document.getElementById('message').textContent = e.message; }
      });

      socket.on('live-error', p => {
        closePeer(p.workerId);
        requested.set(p.workerId, Date.now());
        const c = document.getElementById(p.workerId);
        if (c) c.querySelector('.live').textContent = p.message;
      });

      socket.on('live-status', p => {
        if (p.mode === 'NONE') closePeer(p.workerId);
      });

      setInterval(() => {
        for (const [id, at] of requested) if (Date.now() - at > 30000) requested.delete(id);
        update();
      }, 500);
    })().catch(e => document.getElementById('message').textContent = e.message);
  </script>
</body>
</html>
