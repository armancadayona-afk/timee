<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello Kitty Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root {
      --hk-bg: #ffe4ec;
      --hk-card-bg: rgba(255, 255, 255, 0.9);
      --hk-border: #ffa8c5;
      --hk-border-soft: #ffd0e0;
      --hk-pink-dark: #ff2a6d;
      --hk-pink-mid: #ff5c8a;
      --hk-text: #5a2a3a;
      --hk-muted: #a06b7d;
      --hk-shadow: 0 10px 30px rgba(255, 92, 138, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #ffd6e5;
      background-image:
        radial-gradient(#ff9ebb 1.5px, transparent 1.5px),
        radial-gradient(#ff7599 1.5px, #ffd6e5 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      color: var(--hk-text);
      padding: 20px 16px 60px;
    }

    .wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hk-admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--hk-card-bg);
      backdrop-filter: blur(12px);
      border: 3px solid #ffffff;
      outline: 2px solid var(--hk-border);
      border-radius: 24px;
      padding: 16px 24px;
      box-shadow: var(--hk-shadow);
    }

    .hk-title {
      font-family: 'Pacifico', cursive;
      font-size: 32px;
      color: var(--hk-pink-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hk-card {
      background: var(--hk-card-bg);
      backdrop-filter: blur(12px);
      border: 3px solid #ffffff;
      outline: 2px solid var(--hk-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--hk-shadow);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .worker-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .worker-video-container {
      position: relative;
      background: #222;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid var(--hk-border);
      aspect-ratio: 4/3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .timer-display {
      font-family: 'Fredoka', cursive;
      font-size: 34px;
      color: var(--hk-pink-dark);
      text-align: center;
    }

    .hk-btn {
      background: linear-gradient(180deg, #ff6b95 0%, #ff1f62 100%);
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 18px;
      padding: 8px 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 31, 98, 0.25);
      transition: all 0.2s;
    }

    .hk-btn.secondary {
      background: #ffffff;
      color: var(--hk-pink-dark);
      border: 2px solid var(--hk-border);
    }

    .hk-btn:hover {
      transform: translateY(-1px);
    }

    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .controls-row .hk-btn {
      flex: 1;
      min-width: 90px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 12px !important;
      border-radius: 14px !important;
      border: 2px solid var(--hk-border) !important;
      background: #ffffff !important;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="wrap">
    
    <!-- Admin Header Bar -->
    <header class="hk-admin-header">
      <div class="hk-title">
        <span>🎀</span> Hello Kitty Admin Console 💕
      </div>
      <button id="logoutBtn" class="hk-btn secondary">Log Out ➔</button>
    </header>

    <p id="status" style="font-weight: 700; font-size: 13px; color: var(--hk-muted);">Connecting live worker sessions…</p>

    <!-- Workers Live Feeds Section -->
    <section id="workers" class="grid"></section>

    <!-- Task Assignment & Management Section -->
    <section class="hk-card">
      <h2 style="font-family: 'Fredoka', cursive; color: var(--hk-pink-dark); margin-bottom: 12px;">Tasks & Assign Console 📋🎀</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
        <div>
          <form id="taskForm" onsubmit="event.preventDefault(); assignTask();" style="display: flex; flex-direction: column; gap: 10px;">
            <label style="font-size: 13px; font-weight: 800;">Assign Task To:
              <select id="taskWorkerId" aria-label="Worker Selection">
                <option value="worker1">Worker 1</option>
                <option value="worker2">Worker 2</option>
                <option value="worker3">Worker 3</option>
              </select>
            </label>

            <label style="font-size: 13px; font-weight: 800;">Task Title:
              <input type="text" id="taskTitle" placeholder="e.g. Clean workspace" required aria-label="Task Title">
            </label>

            <label style="font-size: 13px; font-weight: 800;">Instructions:
              <textarea id="taskDesc" rows="3" placeholder="Task details..." aria-label="Task Description"></textarea>
            </label>

            <button type="submit" class="hk-btn">Assign Task 🌸</button>
          </form>
        </div>
        <div>
          <h3 style="font-family: 'Fredoka', cursive; color: var(--hk-pink-dark); margin-bottom: 8px;">Active Worker Tasks</h3>
          <div id="adminTasksList" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            <p style="font-size: 12px; color: var(--hk-muted);">Loading tasks…</p>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    const statusEl = document.getElementById('status');
    const workersContainer = document.getElementById('workers');
    const adminTasksList = document.getElementById('adminTasksList');

    let socket, workers = [];

    async function api(path, body) {
      const r = await fetch(path, {
        method: body ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      const d = await r.json();
      if (!r.ok) throw Error(d.error || 'Request failed');
      return d;
    }

    logoutBtn.onclick = async () => {
      await api('/api/logout', {});
      location.href = '/';
    };

    async function loadTasks() {
      try {
        const res = await api('/api/tasks');
        const tasks = res.tasks || [];
        adminTasksList.innerHTML = '';
        if (tasks.length === 0) {
          adminTasksList.innerHTML = '<p style="font-size:12px; color:var(--hk-muted);">No assigned tasks yet.</p>';
          return;
        }
        tasks.forEach(t => {
          const div = document.createElement('div');
          div.style.background = '#ffffff';
          div.style.border = '1.5px solid var(--hk-border)';
          div.style.borderRadius = '14px';
          div.style.padding = '8px 12px';
          div.innerHTML = `
            <div style="font-weight:800; font-size:13px; color:var(--hk-pink-dark);">[${t.status}] ${t.title}</div>
            <div style="font-size:12px; color:var(--hk-muted);">${t.description || ''}</div>`;
          adminTasksList.appendChild(div);
        });
      } catch (e) {
        console.error('Error loading tasks:', e);
      }
    }

    async function assignTask() {
      const workerId = document.getElementById('taskWorkerId').value;
      const title = document.getElementById('taskTitle').value;
      const description = document.getElementById('taskDesc').value;
      try {
        await api('/api/tasks', { workerId, title, description });
        alert('Task assigned successfully! 💕');
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        loadTasks();
      } catch (e) {
        alert('Failed assigning task: ' + e.message);
      }
    }

    (async () => {
      const me = await api('/api/me');
      if (me.user.role !== 'admin') {
        location.href = '/worker.html';
        return;
      }
      statusEl.textContent = 'Admin session active 🌸';
      loadTasks();

      socket = io();
      socket.on('task:updated', () => loadTasks());
    })();
  </script>
</body>
</html>
