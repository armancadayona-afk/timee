<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello Kitty Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root {
      --hk-bg: #ffe4ec;
      --hk-card-bg: rgba(255, 255, 255, 0.9);
      --hk-border: #ffa8c5;
      --hk-border-soft: #ffd0e0;
      --hk-pink-dark: #ff2a6d;
      --hk-pink-mid: #ff5c8a;
      --hk-text: #5a2a3a;
      --hk-muted: #a06b7d;
      --hk-shadow: 0 10px 30px rgba(255, 92, 138, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #ffd6e5;
      background-image:
        radial-gradient(#ff9ebb 1.5px, transparent 1.5px),
        radial-gradient(#ff7599 1.5px, #ffd6e5 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      color: var(--hk-text);
      padding: 20px 16px 60px;
    }

    .wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hk-admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--hk-card-bg);
      backdrop-filter: blur(12px);
      border: 3px solid #ffffff;
      outline: 2px solid var(--hk-border);
      border-radius: 24px;
      padding: 16px 24px;
      box-shadow: var(--hk-shadow);
    }

    .hk-title {
      font-family: 'Pacifico', cursive;
      font-size: 32px;
      color: var(--hk-pink-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hk-card {
      background: var(--hk-card-bg);
      backdrop-filter: blur(12px);
      border: 3px solid #ffffff;
      outline: 2px solid var(--hk-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--hk-shadow);
    }

    .hk-btn {
      background: linear-gradient(180deg, #ff6b95 0%, #ff1f62 100%);
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 18px;
      padding: 8px 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 31, 98, 0.25);
      transition: all 0.2s;
    }

    .hk-btn.secondary {
      background: #ffffff;
      color: var(--hk-pink-dark);
      border: 2px solid var(--hk-border);
    }

    .hk-btn.danger {
      background: #dc2626;
      color: #ffffff;
      border: 2px solid #ffffff;
    }

    .hk-btn:hover {
      transform: translateY(-1px);
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 12px !important;
      border-radius: 14px !important;
      border: 2px solid var(--hk-border) !important;
      background: #ffffff !important;
      font-family: inherit;
    }

    .device-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .device-table th, .device-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1.5px solid var(--hk-border-soft);
      font-size: 13px;
    }

    .device-table th {
      font-weight: 800;
      color: var(--hk-pink-dark);
      background: #fff0f5;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
    }
    .badge.pending { background: #fef08a; color: #854d0e; }
    .badge.approved { background: #dcfce7; color: #166534; }
    .badge.rejected { background: #fee2e2; color: #991b1b; }
    .badge.revoked { background: #f3f4f6; color: #374151; }
  </style>
</head>
<body>

  <div class="wrap">
    
    <!-- Admin Header -->
    <header class="hk-admin-header">
      <div class="hk-title">
        <span>🎀</span> Hello Kitty Admin Console 💕
      </div>
      <button id="logoutBtn" class="hk-btn secondary">Log Out ➔</button>
    </header>

    <!-- Device Registration Approvals Section (Section 6) -->
    <section class="hk-card">
      <h2 style="font-family: 'Fredoka', cursive; color: var(--hk-pink-dark); margin-bottom: 4px;">Device Registration Approvals 📱🌸</h2>
      <p style="font-size: 13px; color: var(--hk-muted);">Approve, rename, or revoke worker Android device registrations.</p>

      <div style="overflow-x: auto;">
        <table class="device-table">
          <thead>
            <tr>
              <th>Device ID</th>
              <th>Device Name</th>
              <th>Worker Name</th>
              <th>Registration Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="deviceTableBody">
            <tr><td colspan="6" style="text-align:center; color: var(--hk-muted);">Loading devices…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Tasks & Assign Console -->
    <section class="hk-card">
      <h2 style="font-family: 'Fredoka', cursive; color: var(--hk-pink-dark); margin-bottom: 12px;">Tasks & Assign Console 📋🎀</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
        <div>
          <form id="taskForm" onsubmit="event.preventDefault(); assignTask();" style="display: flex; flex-direction: column; gap: 10px;">
            <label style="font-size: 13px; font-weight: 800;">Assign Task To:
              <select id="taskWorkerId" aria-label="Worker Selection">
                <option value="worker1">Worker 1</option>
                <option value="worker2">Worker 2</option>
                <option value="worker3">Worker 3</option>
              </select>
            </label>

            <label style="font-size: 13px; font-weight: 800;">Task Title:
              <input type="text" id="taskTitle" placeholder="e.g. Clean workspace" required aria-label="Task Title">
            </label>

            <label style="font-size: 13px; font-weight: 800;">Instructions:
              <textarea id="taskDesc" rows="3" placeholder="Task details..." aria-label="Task Description"></textarea>
            </label>

            <button type="submit" class="hk-btn">Assign Task 🌸</button>
          </form>
        </div>
        <div>
          <h3 style="font-family: 'Fredoka', cursive; color: var(--hk-pink-dark); margin-bottom: 8px;">Active Worker Tasks</h3>
          <div id="adminTasksList" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            <p style="font-size: 12px; color: var(--hk-muted);">Loading tasks…</p>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    const deviceTableBody = document.getElementById('deviceTableBody');
    const adminTasksList = document.getElementById('adminTasksList');

    async function api(path, method = 'GET', body = null) {
      const options = {
        method,
        headers: { 'Content-Type': 'application/json' },
      };
      if (body) options.body = JSON.stringify(body);
      const r = await fetch(path, options);
      const d = await r.json();
      if (!r.ok) throw Error(d.error || 'Request failed');
      return d;
    }

    logoutBtn.onclick = async () => {
      await api('/api/logout', 'POST', {});
      location.href = '/';
    };

    async function loadDevices() {
      try {
        const res = await api('/api/admin/devices');
        const devices = res.devices || [];
        deviceTableBody.innerHTML = '';
        if (devices.length === 0) {
          deviceTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--hk-muted);">No devices registered yet. 🌸</td></tr>';
          return;
        }

        devices.forEach(dev => {
          const tr = document.createElement('tr');
          const dateStr = dev.registeredAt ? new Date(dev.registeredAt).toLocaleDateString() : 'N/A';
          const statusClass = dev.status || 'pending';

          let actionsHtml = '';
          if (dev.status === 'pending') {
            actionsHtml = `
              <button class="hk-btn" style="padding:4px 10px; font-size:12px;" onclick="approveDev('${dev.deviceId}')">Approve 🌸</button>
              <button class="hk-btn secondary" style="padding:4px 10px; font-size:12px;" onclick="rejectDev('${dev.deviceId}')">Reject ❌</button>`;
          } else if (dev.status === 'approved') {
            actionsHtml = `
              <button class="hk-btn secondary" style="padding:4px 10px; font-size:12px;" onclick="renameDev('${dev.deviceId}', '${dev.workerName || ''}')">Rename ✏️</button>
              <button class="hk-btn danger" style="padding:4px 10px; font-size:12px;" onclick="revokeDev('${dev.deviceId}')">Revoke 🔒</button>`;
          } else {
            actionsHtml = `<button class="hk-btn secondary" style="padding:4px 10px; font-size:12px;" onclick="approveDev('${dev.deviceId}')">Re-Approve 🌸</button>`;
          }

          tr.innerHTML = `
            <td style="font-family:monospace; font-weight:700;">${dev.deviceId}</td>
            <td>${dev.deviceName || 'Android Device'}</td>
            <td><b>${dev.workerName || dev.deviceName || 'Worker'}</b></td>
            <td>${dateStr}</td>
            <td><span class="badge ${statusClass}">${statusClass}</span></td>
            <td><div style="display:flex; gap:6px;">${actionsHtml}</div></td>`;
          deviceTableBody.appendChild(tr);
        });
      } catch (e) {
        console.error('Error loading devices:', e);
      }
    }

    async function approveDev(deviceId) {
      const name = prompt('Enter assigned worker display name:', 'Worker ' + deviceId.substring(0, 4));
      if (name === null) return;
      try {
        await api(`/api/admin/devices/${deviceId}/approve`, 'POST', { workerName: name });
        alert('Device approved! 💕');
        loadDevices();
      } catch (e) {
        alert('Approval failed: ' + e.message);
      }
    }

    async function rejectDev(deviceId) {
      if (!confirm('Reject device ' + deviceId + '?')) return;
      try {
        await api(`/api/admin/devices/${deviceId}/reject`, 'POST', {});
        loadDevices();
      } catch (e) {
        alert('Rejection failed: ' + e.message);
      }
    }

    async function revokeDev(deviceId) {
      if (!confirm('Revoke access for device ' + deviceId + '? This will immediately block worker access.')) return;
      try {
        await api(`/api/admin/devices/${deviceId}/revoke`, 'POST', {});
        loadDevices();
      } catch (e) {
        alert('Revocation failed: ' + e.message);
      }
    }

    async function renameDev(deviceId, currentName) {
      const newName = prompt('Enter new worker display name:', currentName);
      if (!newName || newName === currentName) return;
      try {
        await api(`/api/admin/devices/${deviceId}`, 'PATCH', { workerName: newName });
        loadDevices();
      } catch (e) {
        alert('Rename failed: ' + e.message);
      }
    }

    async function loadTasks() {
      try {
        const res = await api('/api/tasks');
        const tasks = res.tasks || [];
        adminTasksList.innerHTML = '';
        if (tasks.length === 0) {
          adminTasksList.innerHTML = '<p style="font-size:12px; color:var(--hk-muted);">No assigned tasks yet.</p>';
          return;
        }
        tasks.forEach(t => {
          const div = document.createElement('div');
          div.style.background = '#ffffff';
          div.style.border = '1.5px solid var(--hk-border)';
          div.style.borderRadius = '14px';
          div.style.padding = '8px 12px';
          div.innerHTML = `
            <div style="font-weight:800; font-size:13px; color:var(--hk-pink-dark);">[${t.status}] ${t.title}</div>
            <div style="font-size:12px; color:var(--hk-muted);">${t.description || ''}</div>`;
          adminTasksList.appendChild(div);
        });
      } catch (e) {
        console.error('Error loading tasks:', e);
      }
    }

    async function assignTask() {
      const workerId = document.getElementById('taskWorkerId').value;
      const title = document.getElementById('taskTitle').value;
      const description = document.getElementById('taskDesc').value;
      try {
        await api('/api/tasks', 'POST', { workerId, title, description });
        alert('Task assigned successfully! 💕');
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        loadTasks();
      } catch (e) {
        alert('Failed assigning task: ' + e.message);
      }
    }

    (async () => {
      const me = await api('/api/me');
      if (me.user.role !== 'admin') {
        location.href = '/worker.html';
        return;
      }
      loadDevices();
      loadTasks();

      const socket = io();
      socket.on('device:requested', () => loadDevices());
      socket.on('task:updated', () => loadTasks());
    })();
  </script>
</body>
</html>
