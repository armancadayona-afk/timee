<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Timer Admin</title><link rel="stylesheet" href="/styles.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{padding:20px}video{width:100%;background:#111;border-radius:12px;aspect-ratio:4/3}.timer{font-size:38px}.history{white-space:pre-wrap}.tools{display:flex;gap:12px;margin:20px 0}</style></head><body><main class="container"><h1>Work Timer Admin</h1><p>Worker cameras connect automatically. Timer pauses do not stop video or audio.</p><div class="tools"><button class="btn" id="audio">Enable Audio</button><button class="btn secondary" id="logout">Log Out</button></div><p id="message">Connecting…</p><section id="workers" class="grid"></section></main><script src="/socket.io/socket.io.js"></script><script>
let workers=[],socket,iceServers=[],audioEnabled=false;const peers=new Map(), requested=new Map();
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401||r.status===403){location.href='/';throw Error('Sign in required');}const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
function fmt(ms){const t=Math.floor(Math.max(0,ms)/1000);return [Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(x=>String(x).padStart(2,'0')).join(':');}
function closePeer(id){const p=peers.get(id);if(p?.pc)p.pc.close();peers.delete(id);const v=document.getElementById('video-'+id);if(v)v.srcObject=null;requested.delete(id);}
function update(){for(const w of workers){let c=document.getElementById(w.id);if(!c){c=document.createElement('article');c.id=w.id;c.className='card';c.innerHTML='<h2></h2><video autoplay playsinline muted></video><div class="timer"></div><p class="state"></p><p class="live"></p><button class="btn">History</button><p class="history"></p>';c.querySelector('video').id='video-'+w.id;document.getElementById('workers').append(c);c.querySelector('button').onclick=async()=>{try{const d=await api('/api/work-sessions/'+w.id);c.querySelector('.history').textContent=d.sessions.map(s=>new Date(s.startedAt).toLocaleString()+' | '+(s.endedAt?fmt(s.durationMs):'Active shift')).join('\n')||'No completed shifts';}catch(e){c.querySelector('.history').textContent=e.message;}};}c.querySelector('h2').textContent=w.name;c.querySelector('.state').textContent=w.status+' · '+(w.online?'Connected':'Offline');c.querySelector('.timer').textContent=fmt((w.accumulatedMs||0)+(w.status==='WORKING'&&w.startedAt?Date.now()-w.startedAt:0));if(!w.online){closePeer(w.id);c.querySelector('.live').textContent='Camera offline';continue;}if(socket?.connected&&w.captureReady&&w.liveMode==='NONE'&&!peers.has(w.id)&&!requested.has(w.id)){requested.set(w.id,Date.now());socket.emit('admin-live-request',{workerId:w.id,mode:'camera'});c.querySelector('.live').textContent='Connecting camera and audio…';}}}
document.getElementById('audio').onclick=()=>{audioEnabled=true;document.querySelectorAll('video').forEach(v=>{v.muted=false;v.play().catch(()=>{});});document.getElementById('audio').textContent='Audio enabled';};document.getElementById('logout').onclick=async()=>{await api('/api/logout',{});location.href='/';};
(async()=>{const me=await api('/api/me');if(me.user.role!=='admin'){location.href='/worker.html';return;}iceServers=(await api('/api/rtc-config')).iceServers;socket=io();socket.on('connect',()=>{document.getElementById('message').textContent='Connected';for(const id of [...peers.keys()])closePeer(id);requested.clear();update();});socket.on('workers-state',data=>{workers=data;update();});socket.on('disconnect',()=>{document.getElementById('message').textContent='Reconnecting…';for(const id of [...peers.keys()])closePeer(id);requested.clear();});socket.on('rtc-offer',async p=>{const early=peers.get(p.workerId)?.ice||[];closePeer(p.workerId);const pc=new RTCPeerConnection({iceServers});const entry={pc,ice:early};peers.set(p.workerId,entry);pc.ontrack=e=>{const v=document.getElementById('video-'+p.workerId);v.srcObject=e.streams[0]||new MediaStream(e.track?[e.track]:[]);v.muted=!audioEnabled;v.play().catch(()=>{});document.getElementById(p.workerId).querySelector('.live').textContent='Live camera + audio';};pc.onicecandidate=e=>{if(e.candidate)socket.emit('rtc-ice',{targetSocketId:p.workerSocketId,workerId:p.workerId,candidate:e.candidate});};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'){socket.emit('admin-live-stop',{workerId:p.workerId});closePeer(p.workerId);document.getElementById(p.workerId).querySelector('.live').textContent='Connection failed; check TURN settings';requested.set(p.workerId,Date.now()+20000);}};try{await pc.setRemoteDescription(p.offer);for(const ice of entry.ice){try{await pc.addIceCandidate(ice);}catch(_){}}entry.ice=[];await pc.setLocalDescription(await pc.createAnswer());socket.emit('rtc-answer',{targetSocketId:p.workerSocketId,workerId:p.workerId,answer:pc.localDescription});}catch(e){document.getElementById('message').textContent=e.message;socket.emit('admin-live-stop',{workerId:p.workerId});closePeer(p.workerId);}});socket.on('rtc-ice',async p=>{let entry=peers.get(p.workerId);if(!entry){entry={pc:null,ice:[]};peers.set(p.workerId,entry);}if(!entry.pc?.remoteDescription)entry.ice.push(p.candidate);else try{await entry.pc.addIceCandidate(p.candidate);}catch(e){document.getElementById('message').textContent=e.message;}});socket.on('live-error',p=>{closePeer(p.workerId);requested.set(p.workerId,Date.now());const c=document.getElementById(p.workerId);if(c)c.querySelector('.live').textContent=p.message;});socket.on('live-status',p=>{if(p.mode==='NONE')closePeer(p.workerId);});setInterval(()=>{for(const[id,at]of requested)if(Date.now()-at>30000)requested.delete(id);update();},500);})().catch(e=>document.getElementById('message').textContent=e.message);
</script></body></html>
