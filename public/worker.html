<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Timer Worker</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center}.card{width:min(400px,90vw);text-align:center;padding:28px}.timer{font-size:64px}button{min-width:200px}video{width:100%;border-radius:12px;margin:16px 0}</style><style>
.worker-nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.worker-nav button{min-width:0;padding:10px 14px;border-radius:20px;border:1px solid #f6a7c4;background:#fff;color:#c12662;cursor:pointer}.worker-nav button.active{background:#ff2e70;color:white}.worker-panel{margin-top:16px;text-align:left;max-height:55vh;overflow:auto}.worker-panel[hidden]{display:none}.worker-panel input{width:75%;padding:10px}.worker-panel button{min-width:0;padding:9px}.task-entry{padding:12px;margin:8px 0;border:1px solid #f6b9ce;border-radius:12px;overflow-wrap:anywhere}.chat-log{height:200px;overflow:auto;background:#fff4f8;padding:10px;border-radius:12px;overflow-wrap:anywhere}.worker-feedback{color:#b5235a;font-size:13px}
</style></head><body><main class="card"><h2 id="name">Worker</h2><video id="preview" autoplay playsinline muted></video><p id="status">Connecting…</p><div id="timer" class="timer">00:00:00</div><button id="timerBtn" class="btn" disabled>Start Time</button><nav class="worker-nav"><button data-tab="timer" class="active">⏱ Timer</button><button data-tab="tasks">📋 Tasks</button><button data-tab="earnings">💰 Earnings</button><button data-tab="chat">💬 Chat</button></nav><section class="worker-panel" id="worker-tasks" hidden><h3>My Tasks</h3><div id="task-list">Loading…</div></section><section class="worker-panel" id="worker-earnings" hidden><h3>Earnings</h3><p>Approved earnings will appear here when the administrator enables worker earnings.</p></section><section class="worker-panel" id="worker-chat" hidden><h3>Admin Chat</h3><div class="chat-log" id="chat-log"></div><form id="chat-form"><input id="chat-input" maxlength="2000" placeholder="Message Admin" required><button type="submit">Send</button></form></section><p class="worker-feedback" id="worker-feedback" role="status"></p></main><script src="/socket.io/socket.io.js"></script><script>
// Browser fallback: Android worker APKs use native capture, independent of this page.
const button=document.getElementById('timerBtn'), statusEl=document.getElementById('status');
let state, socket, stream, pc, adminId, pendingIce=[], iceServers=[];
async function api(path, body) { const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}); const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d; }
function render(){button.textContent=state?.status==='WORKING'?'Pause':state?.status==='PAUSED'?'Resume':'Start Time';button.disabled=!state;}
function tick(){const ms=(state?.accumulatedMs||0)+(state?.status==='WORKING'?Math.max(0,Date.now()-state.startedAt):0);const t=Math.floor(ms/1000);document.getElementById('timer').textContent=[Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(v=>String(v).padStart(2,'0')).join(':');}
function closePeer(){if(pc)pc.close();pc=null;adminId=null;pendingIce=[];}
button.onclick=async()=>{button.disabled=true;try{const action=state.status==='WORKING'?'pause':state.status==='PAUSED'?'resume':'start';state=(await api('/api/worker/'+action,{})).state;}catch(e){statusEl.textContent=e.message;}finally{render();}};
(async()=>{const me=await api('/api/me');if(me.user.role!=='worker')throw Error('Worker account required');document.getElementById('name').textContent=me.user.name;state=(await api('/api/worker/state')).state;iceServers=(await api('/api/rtc-config')).iceServers;stream=await navigator.mediaDevices.getUserMedia({video:true,audio:{echoCancellation:true,noiseSuppression:true}});document.getElementById('preview').srcObject=stream;statusEl.textContent='Camera and microphone active';socket=io();socket.on('connect',()=>{closePeer();socket.emit('worker-capture-ready');socket.emit('worker-heartbeat');});socket.on('worker-ping',p=>socket.emit('worker-pong',{...p,workerReceivedAt:Date.now()}));
socket.on('device-command', p => {
  if (!['ping','status','info','time','uptime'].includes(p?.command)) return;
  let result='';
  switch(p.command){
    case 'ping': result='PONG — '+new Date().toISOString(); break;
    case 'time': result=new Date().toString(); break;
    case 'status': result=JSON.stringify({connected:socket.connected,timer:state?.status,worker:state?.id});break;
    case 'info': result=JSON.stringify({platform:navigator.platform,userAgent:navigator.userAgent,screen:screen.width+'x'+screen.height,language:navigator.language});break;
    case 'uptime': result=Math.round(performance.now()/1000)+' seconds since worker webpage loaded';break;
  }
  socket.emit('device-command-reply',{adminSocketId:p.adminSocketId,requestId:p.requestId,command:p.command,result});
});
socket.on('timer-updated',p=>{state=p;render();});
socket.on('timer-stopped',()=>{state={...state,status:'STOPPED',startedAt:null,accumulatedMs:0};render();});
socket.on('switch-camera',async p=>{const pref=p?.camera;if(!stream)return;const track=stream.getVideoTracks()[0];let constraints;if(pref==='front')constraints={facingMode:'user'};else if(pref==='back')constraints={facingMode:'environment'};else{const curr=track?.getSettings()?.facingMode;constraints={facingMode:curr==='user'?'environment':'user'};}try{const newStream=await navigator.mediaDevices.getUserMedia({video:constraints,audio:true});const newTrack=newStream.getVideoTracks()[0];if(pc){const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video');if(sender&&newTrack)sender.replaceTrack(newTrack);}if(track)track.stop();stream=newStream;document.getElementById('preview').srcObject=stream;}catch(e){statusEl.textContent='Camera switch failed: '+e.message;}});
socket.on('stop-live',()=>{closePeer();statusEl.textContent='Camera and microphone ready';});socket.on('session-replaced',()=>{stream.getTracks().forEach(t=>t.stop());closePeer();button.disabled=true;statusEl.textContent='This account was opened on another device';});socket.on('live-request',async request=>{if(request.mode!=='camera'){socket.emit('worker-live-error',{...request,message:'These workers support camera and audio only.'});return;}if(pc)return;try{adminId=request.adminSocketId;pendingIce=[];pc=new RTCPeerConnection({iceServers});const current=pc;stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)socket.emit('rtc-ice',{targetSocketId:adminId,workerId:state.id,candidate:e.candidate});};await pc.setLocalDescription(await pc.createOffer());if(pc!==current)return;socket.emit('worker-live-started',{...request});socket.emit('rtc-offer',{targetSocketId:adminId,workerId:state.id,mode:'camera',offer:pc.localDescription});statusEl.textContent='Timer Live';}catch(e){closePeer();socket.emit('worker-live-error',{...request,message:e.message});}});socket.on('rtc-answer',async p=>{if(!pc||p.adminSocketId!==adminId)return;try{await pc.setRemoteDescription(p.answer);for(const c of pendingIce)await pc.addIceCandidate(c);pendingIce=[];}catch(e){statusEl.textContent=e.message;}});socket.on('rtc-ice',async p=>{if(!pc||p.fromSocketId!==adminId)return;if(!pc.remoteDescription)pendingIce.push(p.candidate);else try{await pc.addIceCandidate(p.candidate);}catch(e){statusEl.textContent=e.message;}});setInterval(()=>{if(socket.connected)socket.emit('worker-heartbeat');},10000);render();setInterval(tick,500);})().catch(e=>{statusEl.textContent=e.message+' — open your assigned Android app, or sign in on the homepage.';});
</script><script src="/worker-features.js"></script></body></html>
