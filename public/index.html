<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kitty Timer | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f02f70;
      --bg: #fff4f8;
      --card: rgba(255, 255, 255, 0.9);
      --text: #24324b;
      --line: #ffd0e0;
    }
    body {
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Nunito', sans-serif;
      color: var(--text);
    }
    .login-shell {
      width: 100%; max-width: 420px; padding: 20px;
    }
    .card {
      background: var(--card); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 24px;
      box-shadow: 0 10px 30px rgba(240, 47, 112, 0.15);
      padding: 30px; text-align: center;
      position: relative;
    }
    .brand-mark {
      font-size: 50px; margin-bottom: 10px;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .eyebrow {
      font-family: 'Pacifico', cursive; color: var(--primary); font-size: 24px; margin-bottom: -5px;
    }
    h1 {
      font-family: 'Fredoka', sans-serif; color: var(--text); font-size: 28px; margin: 10px 0;
    }
    p.muted {
      color: #71809a; font-size: 14px; margin-bottom: 24px;
    }
    form { display: flex; flex-direction: column; gap: 16px; text-align: left; }
    label { font-size: 13px; font-weight: 700; color: #52627e; display: flex; flex-direction: column; gap: 8px; }
    input {
      font-family: 'Nunito', sans-serif; font-size: 15px;
      padding: 12px 16px; border-radius: 12px;
      border: 2px solid var(--line); outline: none;
      transition: border-color 0.2s; background: #fff;
    }
    input:focus { border-color: var(--primary); }
    .btn {
      background: linear-gradient(135deg, #ff5c8a, #f02f70);
      color: #fff; border: none; border-radius: 12px;
      padding: 14px; font-family: 'Fredoka', sans-serif; font-size: 18px;
      cursor: pointer; box-shadow: 0 4px 14px rgba(240, 47, 112, 0.3);
      transition: transform 0.2s; margin-top: 10px;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="card login-card" aria-labelledby="loginTitle">
      <div class="brand-mark">🎀</div>
      <div class="eyebrow">Hello Kitty WorkTimer</div>
      <h1 id="loginTitle">Welcome Back</h1>
      <p class="muted">Sign in to your assigned account.</p>
      
      <form id="loginForm">
        <label>Username
          <input id="username" name="username" autocomplete="username" placeholder="Enter username" required autofocus>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>
        <button id="loginBtn" class="btn" type="submit">Sign In 💖</button>
        <p id="message" style="margin-top: 10px; color: var(--primary); text-align: center; font-size: 13px; font-weight: 700;" aria-live="polite"></p>
      </form>
    </section>
  </main>

<script>
  const form = document.getElementById('loginForm');
  const button = document.getElementById('loginBtn');
  const message = document.getElementById('message');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    message.textContent = 'Signing in…';
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Login failed');
      location.href = data.redirect;
    } catch (error) {
      message.textContent = error.message;
      button.disabled = false;
    }
  });
</script>
</body>
</html>
